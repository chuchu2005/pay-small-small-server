name: keep-render-awake
# Pings the Render service so it does not sleep on the free tier and
# cold-start during review. GitHub cron is best-effort; for production
# use a paid tier or a dedicated uptime pinger.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://pay-small-small-server.onrender.com/ || true)
          echo "health check returned HTTP $code"
